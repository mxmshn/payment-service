spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5443/payment_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:/db/changelog/changelog-master.xml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable:
          idempotence: true
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:payment-service}
      key-deserializer: org.apache.kafka.common.serialization.StringSerializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonSerializer
      auto-offset-reset: earliest
    topics:
      payment-status-updated: payment.status.updated
      payment-execution-request: payment.execution.request
      payment-execution-response: payment.execution.response

app:
  pagination:
    allowed-sort: [ "createdAt", "status" ]
    allowed-page-size: [ 10, 25, 50 ]
    default-page-number: 0
    default-page-size: 10
    default-field-sort: createdAt
    default-direction-sort: ASC
